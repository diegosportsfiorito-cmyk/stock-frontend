<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>STOCK IA PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="app">

        <!-- HEADER SIMPLE -->
        <header class="header">
            <h1>STOCK IA PRO</h1>
        </header>

        <!-- CONTENEDOR PRINCIPAL -->
        <main class="main-container">

            <!-- BLOQUE BUSCADOR -->
            <section class="search-section">
                <label for="search-input" class="search-label">Buscar artículo / descripción</label>

                <div class="search-input-wrapper orb-tooltip-wrapper">
                    <input
                        id="search-input"
                        type="text"
                        placeholder="Escribí o escaneá un código..."
                        autocomplete="off"
                    />

                    <!-- ÍCONO CÁMARA DENTRO DEL INPUT -->
                    <button id="btn-scanner" class="scanner-icon-btn" type="button" aria-label="Escanear código">
                        <span class="scanner-icon-camera"></span>
                    </button>

                    <!-- ORB -->
                    <button id="orb-button" class="orb-button orb-tooltip-halo" type="button" aria-label="Buscar">
                        <span class="orb-core"></span>
                    </button>
                </div>

                <!-- SWITCH MODO SCANNER (A2: debajo del input) -->
                <div class="scanner-mode-switch">
                    <span class="switch-label">Modo scanner:</span>
                    <label class="switch">
                        <input type="checkbox" id="scanner-mode-switch" />
                        <span class="slider"></span>
                    </label>
                    <span id="scanner-mode-text">Solo artículo</span>
                </div>

                <!-- OPCIONES BÁSICAS -->
                <div class="search-options">
                    <label class="checkbox-inline">
                        <input type="checkbox" id="solo-stock" />
                        Solo stock
                    </label>
                </div>
            </section>

            <!-- FILTROS AVANZADOS -->
            <section class="filters-section">
                <h2>Filtros avanzados</h2>

                <div class="filters-grid">
                    <div class="filter-item">
                        <label for="filtro-marca">Marca</label>
                        <select id="filtro-marca">
                            <option value="">Todas</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="filtro-rubro">Rubro</label>
                        <select id="filtro-rubro">
                            <option value="">Todos</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="filtro-talle-desde">Talle desde</label>
                        <input id="filtro-talle-desde" type="number" min="0" />
                    </div>

                    <div class="filter-item">
                        <label for="filtro-talle-hasta">Talle hasta</label>
                        <input id="filtro-talle-hasta" type="number" min="0" />
                    </div>
                </div>

                <div class="filters-actions">
                    <button id="btn-aplicar-filtros" type="button">Aplicar filtros</button>
                    <button id="btn-limpiar-filtros" type="button">Limpiar filtros</button>
                </div>
            </section>

            <!-- RESULTADOS -->
            <section class="results-section">
                <h2>Resultados</h2>
                <div id="results-container"></div>
            </section>

        </main>

        <!-- PANEL ADMIN (OCULTO POR COMBINACIÓN DE TECLAS O BOTÓN) -->
        <aside id="admin-panel" class="admin-panel hidden">
            <h2>Panel admin</h2>

            <div class="admin-item">
                <label for="orb-tooltip-mode">Modo tooltip ORB</label>
                <select id="orb-tooltip-mode">
                    <option value="halo">Halo direccional (por defecto)</option>
                    <option value="pulse">Pulse hint</option>
                    <option value="hover">Hover glow</option>
                </select>
            </div>
        </aside>

        <!-- OVERLAY SCANNER -->
        <div id="scanner-overlay" class="scanner-overlay">
            <div class="scanner-content">
                <video id="scanner-video" autoplay playsinline></video>
                <div class="scanner-frame"></div>
                <button id="scanner-close" type="button" class="scanner-close-btn">Cerrar</button>
            </div>
        </div>

    </div>

    <script src="scanner.js"></script>
    <script src="app.js"></script>
</body>
</html>
