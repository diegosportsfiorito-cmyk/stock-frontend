<!-- ===== BLOQUE 1 — HEAD Y ESTILOS ===== -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock IA v1.2.2 PRO</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        #app {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 12px;
            font-size: 16px;
        }
        #respuesta {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
<div id="app">
    <h2>Stock IA v1.2.2 PRO</h2>

    <input id="pregunta" type="text" placeholder="Escribe tu consulta..." style="width:100%;" />

    <br><br>

    <button id="btnEnviar">Enviar</button>
    <button id="btnScanner">Scanner</button>
    <button id="btnLimpiar">Limpiar</button>

    <div id="respuesta"></div>

    <video id="preview" style="width:100%; margin-top:20px; display:none;"></video>
</div>
<!-- ===== BLOQUE 2 — LÓGICA PRINCIPAL ===== -->
<script>
const backendURL = "https://stock-backend-1-twzg.onrender.com/query";

document.getElementById("btnEnviar").addEventListener("click", async () => {
    const pregunta = document.getElementById("pregunta").value.trim();
    if (!pregunta) return;

    document.getElementById("respuesta").innerText = "Consultando...";

    try {
        const res = await fetch(backendURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: pregunta })
        });

        const data = await res.json();
        document.getElementById("respuesta").innerText = JSON.stringify(data, null, 2);

    } catch (e) {
        document.getElementById("respuesta").innerText = "Error consultando backend.";
        console.error(e);
    }
});

document.getElementById("btnLimpiar").addEventListener("click", () => {
    document.getElementById("pregunta").value = "";
    document.getElementById("respuesta").innerText = "";
});
</script>
<!-- ===== BLOQUE 3 — SCANNER ZXING ===== -->

<!-- Librería ZXing -->
<script src="https://unpkg.com/@zxing/library@latest"></script>

<script>
let scannerActivo = false;

document.getElementById("btnScanner").addEventListener("click", async () => {
    const preview = document.getElementById("preview");

    if (!scannerActivo) {
        preview.style.display = "block";

        const codeReader = new ZXing.BrowserMultiFormatReader();
        scannerActivo = true;

        try {
            const devices = await codeReader.listVideoInputDevices();
            const cam = devices[0].deviceId;

            codeReader.decodeFromVideoDevice(cam, "preview", (result, err) => {
                if (result) {
                    document.getElementById("pregunta").value = result.text;
                    document.getElementById("respuesta").innerText = "Código detectado: " + result.text;
                }
            });

        } catch (e) {
            console.error(e);
            document.getElementById("respuesta").innerText = "Error iniciando scanner.";
        }

    } else {
        preview.style.display = "none";
        scannerActivo = false;
        location.reload();
    }
});
</script>

</body>
</html>
