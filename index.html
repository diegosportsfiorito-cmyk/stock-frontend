<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Stock IA PRO v2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ============================================================
   VARIABLES
============================================================ */
:root {
    --bg: #050816;
    --bg-elevated: #0b1020;
    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, 0.18);
    --accent-strong: #6366f1;
    --text: #e5e7eb;
    --text-soft: #9ca3af;
    --danger: #ef4444;
    --success: #22c55e;
    --border-subtle: rgba(148, 163, 184, 0.25);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-pill: 999px;
    --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.75);
}

/* ============================================================
   RESET
============================================================ */
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", sans-serif;
    background: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
    color: var(--text);
    display: flex;
    justify-content: center;
}

/* ============================================================
   LAYOUT
============================================================ */
.app-shell {
    width: 100%;
    max-width: 1200px;
    margin: 24px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 18px;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-logo {
    width: 52px;
    height: 52px;
    border-radius: 18px;
    background: radial-gradient(circle at 30% 20%, #a855f7, #4f46e5 45%, #0ea5e9 100%);
    box-shadow: 0 0 35px rgba(79, 70, 229, 0.7);
}

.brand-text-title {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.brand-text-sub {
    font-size: 0.8rem;
    color: var(--text-soft);
}

.pill {
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: rgba(15, 23, 42, 0.8);
    display: flex;
    align-items: center;
    gap: 6px;
}

.pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--success);
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
}

.app-main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 18px;
}

.panel {
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.9));
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-soft);
    padding: 18px;
    position: relative;
}

.panel-title {
    font-size: 0.95rem;
    font-weight: 500;
}

.panel-subtitle {
    font-size: 0.8rem;
    color: var(--text-soft);
    margin-bottom: 14px;
}

/* ============================================================
   ORB ANIMADO
============================================================ */
.orb-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
}

.orb {
    width: 82px;
    height: 82px;
    border-radius: 999px;
    background:
        radial-gradient(circle at 30% 20%, #a855f7, transparent 55%),
        radial-gradient(circle at 70% 80%, #0ea5e9, transparent 55%),
        radial-gradient(circle at 50% 50%, #4f46e5, #111827 70%);
    box-shadow:
        0 0 25px rgba(79, 70, 229, 0.9),
        0 0 55px rgba(56, 189, 248, 0.7);
    animation: orb-breathe 3.8s ease-in-out infinite;
}

@keyframes orb-breathe {
    0% { transform: scale(0.96); }
    50% { transform: scale(1.04); }
    100% { transform: scale(0.96); }
}

/* ============================================================
   INPUT
============================================================ */
.input-shell {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.9);
    border-radius: var(--radius-pill);
    border: 1px solid rgba(148, 163, 184, 0.45);
    padding: 4px 12px;
}

.input-prefix {
    font-size: 0.78rem;
    color: var(--text-soft);
    padding-right: 6px;
    border-right: 1px solid rgba(148, 163, 184, 0.35);
}

#queryInput {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
}

.btn {
    border: none;
    border-radius: var(--radius-pill);
    padding: 6px 12px;
    font-size: 0.78rem;
    cursor: pointer;
    background: rgba(15, 23, 42, 0.9);
    color: var(--text-soft);
    border: 1px solid rgba(148, 163, 184, 0.4);
}

.btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: white;
    border: none;
}

/* ============================================================
   RESPUESTA
============================================================ */
.response-shell {
    background: rgba(15, 23, 42, 0.9);
    border-radius: var(--radius-md);
    border: 1px solid rgba(148, 163, 184, 0.4);
    padding: 10px 12px;
    min-height: 120px;
    font-size: 0.8rem;
    overflow: auto;
}

pre {
    margin: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* ============================================================
   AUTOCOMPLETE
============================================================ */
.autocomplete-list {
    margin: 0;
    padding: 6px 0;
    list-style: none;
    border-radius: var(--radius-md);
    background: rgba(15, 23, 42, 0.98);
    border: 1px solid rgba(148, 163, 184, 0.4);
    max-height: 180px;
    overflow-y: auto;
    font-size: 0.8rem;
}

.autocomplete-item {
    padding: 6px 10px;
    cursor: pointer;
    color: var(--text-soft);
}

.autocomplete-item:hover {
    background: rgba(30, 64, 175, 0.35);
    color: #e5e7eb;
}
</style>
</head>

<body>
<div class="app-shell">

<header class="app-header">
    <div class="brand">
        <div class="brand-logo"></div>
        <div>
            <div class="brand-text-title">Stock IA PRO v2.0</div>
            <div class="brand-text-sub">Asistente inteligente de stock</div>
        </div>
    </div>

    <div class="pill">
        <span class="pill-dot"></span>
        <span>Backend conectado</span>
    </div>
</header>

<main class="app-main">

<!-- PANEL IZQUIERDO -->
<section class="panel">
    <div class="panel-title">Consulta de stock</div>
    <div class="panel-subtitle">Escribí o hablá como si fuera una persona.</div>

    <div class="orb-wrapper">
        <div class="orb" id="orbStatus"></div>
    </div>

    <div class="input-shell">
        <span class="input-prefix">¿Qué stock hay de…?</span>
        <input id="queryInput" type="text" placeholder="pantuflas avengers plush" autocomplete="off" />
        <button id="btnSend" class="btn btn-primary">Consultar</button>
    </div>

    <ul id="autocompleteList" class="autocomplete-list" style="display:none;"></ul>

    <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
        <button id="btnSpeak" class="btn">Hablar</button>
        <button id="btnHandsFree" class="btn">Manos libres</button>
        <button id="btnStop" class="btn">Stop</button>
        <button id="btnClear" class="btn">Limpiar</button>
        <button id="btnCopy" class="btn">Copiar</button>
    </div>
</section>

<!-- PANEL DERECHO -->
<section class="panel">
    <div class="panel-title">Resultado</div>

    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
        <button id="btnViewJson" class="btn btn-primary">JSON</button>
        <button id="btnViewList" class="btn">Lista</button>
        <button id="btnViewCards" class="btn">Tarjetas</button>
        <button id="btnViewTable" class="btn">Tabla</button>
        <button id="btnViewDashboard" class="btn">Dashboard</button>
    </div>

    <div id="responseContainer" class="response-shell">
        <pre id="responsePre">{}</pre>
    </div>

    <div style="margin-top:8px; font-size:0.75rem; color:var(--text-soft);">
        <span id="responseVoice">Listo para responder.</span>
    </div>
</section>

</main>
</div>

<script>
/* ============================================================
   JS BÁSICO (HOOKS)
============================================================ */

const input = document.getElementById("queryInput");
const btnSend = document.getElementById("btnSend");
const responsePre = document.getElementById("responsePre");
const autocompleteList = document.getElementById("autocompleteList");

/* ENTER envía */
input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        btnSend.click();
    }
});

/* AUTOCOMPLETE */
input.addEventListener("input", async () => {
    const q = input.value.trim();
    if (!q) {
        autocompleteList.style.display = "none";
        return;
    }

    try {
        const r = await fetch(`https://stock-backend-1-twzg.onrender.com/autocomplete?q=${encodeURIComponent(q)}`);
        const data = await r.json();

        autocompleteList.innerHTML = "";
        if (data.sugerencias && data.sugerencias.length > 0) {
            data.sugerencias.forEach(s => {
                const li = document.createElement("li");
                li.className = "autocomplete-item";
                li.textContent = s;
                li.onclick = () => {
                    input.value = s;
                    autocompleteList.style.display = "none";
                };
                autocompleteList.appendChild(li);
            });
            autocompleteList.style.display = "block";
        } else {
            autocompleteList.style.display = "none";
        }
    } catch (e) {
        autocompleteList.style.display = "none";
    }
});

/* CONSULTA */
btnSend.addEventListener("click", async () => {
    const q = input.value.trim();
    if (!q) return;

    responsePre.textContent = "Consultando...";

    try {
        const r = await fetch("https://stock-backend-1-twzg.onrender.com/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pregunta: q })
        });

        const data = await r.json();
        responsePre.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
        responsePre.textContent = "Error consultando backend.";
    }
});
</script>

</body>
</html>
