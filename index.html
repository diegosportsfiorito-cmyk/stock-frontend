<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock IA v1.3 PRO</title>

    <style>
        :root {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #222;
            --primary: #0066ff;
            --primary-hover: #0050cc;
            --border: #e0e0e0;
            --shadow: rgba(0,0,0,0.08);
        }

        body.dark {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #f1f1f1;
            --primary: #4d8dff;
            --primary-hover: #3c6dcc;
            --border: #333;
            --shadow: rgba(255,255,255,0.05);
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: 0.3s ease;
        }

        #app {
            max-width: 900px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px var(--shadow);
            transition: 0.3s ease;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 16px;
            background: var(--card-bg);
            color: var(--text);
        }

        button {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 4px;
            transition: 0.2s ease;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            margin-top: 15px;
            box-shadow: 0 2px 12px var(--shadow);
            border: 1px solid var(--border);
            transition: 0.3s ease;
        }

        .btnVerMas, .btnVerMenos {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btnVerMas:hover, .btnVerMenos:hover {
            background: var(--primary);
            color: white;
        }

        #historial {
            margin-top: 20px;
            padding: 10px;
            border-left: 4px solid var(--primary);
        }

        #preview {
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 2px 12px var(--shadow);
        }
    </style>
</head>

<body>
<div id="app">
    <h2>Stock IA v1.3 PRO</h2>

    <input id="pregunta" type="text" placeholder="Escribe tu consulta..." />

    <br><br>

    <button id="btnEnviar">Enviar</button>
    <button id="btnScannerExterno">Scanner externo (recomendado)</button>
    <button id="btnScanner">Scanner interno</button>
    <button id="btnHablar">Hablar</button>
    <button id="btnLimpiar">Limpiar</button>
    <button id="btnCopiar">Copiar</button>
    <button id="btnDark">Modo oscuro</button>
    <button id="btnWhatsApp">WhatsApp</button>

    <br><br>

    <label>
        <input type="checkbox" id="chkStock"> Mostrar solo talles con stock disponible
    </label>

    <div id="respuesta"></div>

    <h3>Historial</h3>
    <div id="historial"></div>

    <video id="preview" style="width:100%; display:none;"></video>
</div>

<!-- ===== BLOQUE 2 — LÓGICA PRINCIPAL ===== -->
<script>
const backendURL = "https://stock-backend-1-twzg.onrender.com/query";

function hablar(texto) {
    const msg = new SpeechSynthesisUtterance(texto);
    msg.lang = "es-AR";
    speechSynthesis.speak(msg);
}

function agregarHistorial(pregunta) {
    const h = document.getElementById("historial");
    const item = document.createElement("div");
    item.innerHTML = `• ${pregunta}`;
    h.appendChild(item);
}

function renderResultados(data) {
    const cont = document.getElementById("respuesta");
    cont.innerHTML = "";

    if (!data.items || data.items.length === 0) {
        cont.innerHTML = "<p>No se encontraron resultados.</p>";
        return;
    }

    data.items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        const stockTotal = item.talles.reduce((acc, t) => acc + t.stock, 0);

        let talles = item.talles;
        if (document.getElementById("chkStock").checked) {
            talles = talles.filter(t => t.stock > 0);
        }

        const tallesHTML = talles
            .map(t => `<li>${t.talle} → Stock: ${t.stock}</li>`)
            .join("");

        const detalleID = `detalle_${index}`;

        card.innerHTML = `
            <h3>${item.descripcion}</h3>
            <p><b>Precio:</b> $${item.precio}</p>
            <p><b>Stock total:</b> ${stockTotal}</p>

            <button class="btnVerMas" data-target="${detalleID}">
                Ver más
            </button>

            <div id="${detalleID}" style="display:none; margin-top:10px;">
                <p><b>Código:</b> ${item.codigo}</p>
                <p><b>Marca:</b> ${item.marca || "-"}</p>
                <p><b>Rubro:</b> ${item.rubro || "-"}</p>
                <p><b>Color:</b> ${item.color || "-"}</p>

                <p><b>Talles:</b></p>
                <ul>${tallesHTML}</ul>

                <button class="btnVerMenos" data-target="${detalleID}">
                    Ver menos
                </button>

                <p style="font-size:12px; opacity:0.7; margin-top:10px;">
                    Fuente: ${data.fuente?.name || "Desconocida"}
                </p>
            </div>
        `;

        cont.appendChild(card);
    });

    document.querySelectorAll(".btnVerMas").forEach(btn => {
        btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-target");
            document.getElementById(id).style.display = "block";
            btn.style.display = "none";
        });
    });

    document.querySelectorAll(".btnVerMenos").forEach(btn => {
        btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-target");
            document.getElementById(id).style.display = "none";
            const btnMas = document.querySelector(`.btnVerMas[data-target="${id}"]`);
            if (btnMas) btnMas.style.display = "inline-block";
        });
    });
}

document.getElementById("btnEnviar").addEventListener("click", async () => {
    const pregunta = document.getElementById("pregunta").value.trim();
    if (!pregunta) return;

    document.getElementById("respuesta").innerHTML = "<p>Consultando...</p>";

    try {
        const res = await fetch(backendURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: pregunta })
        });

        const data = await res.json();

        agregarHistorial(pregunta);
        renderResultados(data);
        hablar(data.voz);

    } catch (e) {
        document.getElementById("respuesta").innerHTML = "<p>Error consultando backend.</p>";
        console.error(e);
    }
});

document.getElementById("btnLimpiar").addEventListener("click", () => {
    document.getElementById("pregunta").value = "";
    document.getElementById("respuesta").innerHTML = "";
});

document.getElementById("btnCopiar").addEventListener("click", () => {
    const texto = document.getElementById("respuesta").innerText;
    navigator.clipboard.writeText(texto);
    alert("Respuesta copiada");
});

document.getElementById("btnDark").addEventListener("click", () => {
    document.body.classList.toggle("dark");
});

document.getElementById("btnWhatsApp").addEventListener("click", () => {
    const texto = encodeURIComponent(document.getElementById("respuesta").innerText);
    window.open(`https://wa.me/?text=${texto}`);
});

document.getElementById("btnHablar").addEventListener("click", () => {
    const rec = new webkitSpeechRecognition();
    rec.lang = "es-AR";
    rec.onresult = e => {
        document.getElementById("pregunta").value = e.results[0][0].transcript;
    };
    rec.start();
});
</script>

<!-- ===== BLOQUE 3 — SCANNER EXTERNO (RECOMENDADO) ===== -->
<script>
document.getElementById("btnScannerExterno").addEventListener("click", () => {
    const callback = encodeURIComponent(window.location.origin + "/?code={CODE}");
    const intentURL = `zxing://scan/?ret=${callback}`;

    window.location.href = intentURL;

    setTimeout(() => {
        window.location.href = "https://play.google.com/store/apps/details?id=com.google.zxing.client.android";
    }, 1500);
});

// Detectar retorno desde app externa
const params = new URLSearchParams(window.location.search);
if (params.has("code")) {
    const codigo = params.get("code");
    document.getElementById("pregunta").value = codigo;
    document.getElementById("btnEnviar").click();
}
</script>

<!-- ===== BLOQUE 4 — SCANNER INTERNO (ZXING) ===== -->
<script src="https://unpkg.com/@zxing/library@latest"></script>

<script>
let scannerActivo = false;

document.getElementById("btnScanner").addEventListener("click", async () => {
    const preview = document.getElementById("preview");

    if (!scannerActivo) {
        preview.style.display = "block";

        const codeReader = new ZXing.BrowserMultiFormatReader();

        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
            ZXing.BarcodeFormat.EAN_13,
            ZXing.BarcodeFormat.EAN_8,
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.CODE_39,
            ZXing.BarcodeFormat.UPC_A
        ]);
        codeReader.defaultOptions = { hints: hints };

        scannerActivo = true;

        try {
            const devices = await codeReader.listVideoInputDevices();

            if (!devices || devices.length === 0) {
                document.getElementById("respuesta").innerHTML =
                    "<p>No se encontraron cámaras.</p>";
                return;
            }

            let cam = devices.find(d =>
                d.label.toLowerCase().includes("back") ||
                d.label.toLowerCase().includes("rear")
            );

            if (!cam) cam = devices[devices.length - 1];

            codeReader.decodeFromVideoDevice(
                cam.deviceId,
                "preview",
                (result, err) => {
                    if (result) {
                        document.getElementById("pregunta").value = result.text;
                        document.getElementById("respuesta").innerHTML =
                            "<p>Código detectado: " + result.text + "</p>";
                    }
                },
                {
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        focusMode: "continuous"
                    }
                }
            );

        } catch (e) {
            console.error(e);
            document.getElementById("respuesta").innerHTML =
                "<p>Error iniciando scanner.</p>";
        }

    } else {
        preview.style.display = "none";
        scannerActivo = false;
        location.reload();
    }
});
</script>

</body>
</html>
