<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#111111" />

    <title>Stock IA</title>

    <style>
        :root {
            --bg-dark: #111;
            --bg-light: #f5f5f5;
            --text-dark: #fff;
            --text-light: #111;
            --card-dark: #1b1b1b;
            --card-light: #ffffff;
            --accent: #4ea1ff;
        }

        body.dark {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        body.light {
            background: var(--bg-light);
            color: var(--text-light);
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #333;
        }

        #logo {
            width: 45px;
            height: 45px;
            background: #444;
            border-radius: 8px;
        }

        #title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        #themeToggle {
            margin-left: auto;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            border: none;
        }

        #container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        #inputBox {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
        }

        button {
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
        }

        #status {
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        #results {
            margin-top: 25px;
        }

        .card {
            background: var(--card-dark);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        body.light .card {
            background: var(--card-light);
            border: 1px solid #ddd;
        }

        #history {
            margin-top: 30px;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            opacity: 0.5;
            font-size: 0.8rem;
        }

        #voiceControls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>

<body class="dark">

<header>
    <div id="logo"></div>
    <div id="title">Stock IA</div>
    <button id="themeToggle">Modo Claro</button>
</header>

<div id="container">

    <div id="inputBox">
        <input id="question" placeholder="Preguntá por código o descripción..." />
        <button id="sendBtn">Enviar</button>
        <button id="micBtn">🎤</button>
    </div>

    <div id="voiceControls">
        <button id="repeatBtn">🔁 Repetir</button>
        <button id="muteBtn">🔇 Mute</button>
        <select id="voiceSelect"></select>
    </div>

    <div id="status">Listo.</div>

    <div id="results"></div>

    <div id="history"></div>

    <footer>
        Stock IA — v1.0.0
    </footer>

</div>

<script>
    const API_URL = "https://stock-backend-1-twzg.onrender.com/query";

    let muted = false;
    let lastResponse = "";
    let voices = [];

    // ============================
    // MODO OSCURO / CLARO
    // ============================

    const themeToggle = document.getElementById("themeToggle");
    themeToggle.onclick = () => {
        document.body.classList.toggle("light");
        document.body.classList.toggle("dark");

        themeToggle.textContent =
            document.body.classList.contains("light")
                ? "Modo Oscuro"
                : "Modo Claro";
    };

    // ============================
    // TEXT TO SPEECH
    // ============================

    function loadVoices() {
        voices = speechSynthesis.getVoices();
        const select = document.getElementById("voiceSelect");
        select.innerHTML = "";
        voices.forEach((v, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = `${v.name} (${v.lang})`;
            select.appendChild(opt);
        });
    }

    speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text) {
        if (muted) return;
        const msg = new SpeechSynthesisUtterance(text);
        const idx = document.getElementById("voiceSelect").value;
        msg.voice = voices[idx];
        speechSynthesis.speak(msg);
    }

    document.getElementById("repeatBtn").onclick = () => speak(lastResponse);
    document.getElementById("muteBtn").onclick = () => {
        muted = !muted;
        document.getElementById("muteBtn").textContent = muted ? "🔊 Unmute" : "🔇 Mute";
    };

    // ============================
    // SPEECH TO TEXT (MIC)
    // ============================

    const micBtn = document.getElementById("micBtn");
    let recognition;

    if ("webkitSpeechRecognition" in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = "es-AR";
        recognition.continuous = false;

        micBtn.onclick = () => recognition.start();

        recognition.onresult = (e) => {
            document.getElementById("question").value =
                e.results[0][0].transcript;
        };
    } else {
        micBtn.disabled = true;
    }

    // ============================
    // CONSULTA AL BACKEND
    // ============================

    async function sendQuery() {
        const q = document.getElementById("question").value.trim();
        if (!q) return;

        document.getElementById("status").textContent = "Buscando...";
        document.getElementById("results").innerHTML = "";

        const t0 = performance.now();

        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q }),
        });

        const data = await res.json();
        const t1 = performance.now();

        lastResponse = data.respuesta;
        speak(lastResponse);

        // Mostrar resultados
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        if (data.respuesta) {
            const card = document.createElement("div");
            card.className = "card";
            card.textContent = data.respuesta;
            resultsDiv.appendChild(card);
        }

        // Logging
        const history = document.getElementById("history");
        const entry = document.createElement("div");
        entry.textContent = `> ${q} (${Math.round(t1 - t0)} ms)`;
        history.prepend(entry);

        document.getElementById("status").textContent = "Listo.";
    }

    document.getElementById("sendBtn").onclick = sendQuery;
    document.getElementById("question").onkeydown = (e) => {
        if (e.key === "Enter") sendQuery();
    };

    loadVoices();
</script>

</body>
</html>
