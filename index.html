<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOCK IA PRO — Asistente inteligente de stock</title>

  <link rel="stylesheet" href="orb.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="orb-center orb-b2">

  <div class="app-shell">
    <div class="app-container">

      <div class="app-header">
        <div class="branding">
          <div>
            <div class="brand-title">STOCK IA PRO</div>
            <div class="brand-subtitle">Asistente inteligente de stock</div>
          </div>
        </div>

        <div class="header-right">
          <div class="connection-indicator">
            <div class="connection-dot"></div>
            <span>Estado conexión</span>
          </div>
        </div>
      </div>

      <!-- ORB SOBRE EL INPUT -->
      <div class="orb-zone">
        <div class="orb-wrapper">
          <div class="orb" id="orb">IA PRO</div>
        </div>
      </div>

      <div class="top-controls">
        <button class="mode-toggle" id="toggle-dark">Modo Día/Noche</button>
        <button class="admin-btn" id="open-admin">Admin</button>
        <button class="voice-btn" id="toggle-voice">Voz</button>

        <div class="switch-row">
          <span>Manos libres</span>
          <label class="switch">
            <input type="checkbox" id="handsfree-toggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <section class="search-card">
        <div class="search-row">
          <div class="search-input-wrapper">
            <input id="search-input" class="search-input" type="text" placeholder="Buscar artículo, marca o rubro…" autocomplete="off" />
            <span class="search-icon">🔍</span>
          </div>
        </div>

        <div class="actions-row">
          <label class="solo-stock">
            <input type="checkbox" id="chk-solo-stock" />
            Mostrar solo con stock
          </label>

          <button class="btn-secondary" id="btn-scan">Leer código</button>
          <button class="btn-secondary" id="btn-clear">Limpiar</button>
          <button class="btn-secondary" id="btn-copy">Copiar</button>
          <button class="btn-secondary" id="btn-filtros">Filtros</button>
          <button class="btn-ghost" id="btn-stop">STOP</button>
        </div>

        <div class="metrics-row">
          <div class="metric-card"><div class="metric-label">ARTÍCULOS</div><div class="metric-value" id="metric-articulos">0</div></div>
          <div class="metric-card"><div class="metric-label">PARES</div><div class="metric-value" id="metric-pares">0</div></div>
          <div class="metric-card"><div class="metric-label">ALERTAS</div><div class="metric-value" id="metric-alertas">0</div></div>
          <div class="metric-card"><div class="metric-label">VALORIZADO</div><div class="metric-value" id="metric-valorizado">$0</div></div>
        </div>

        <div class="filtros-panel" id="filtros-panel">
          <div class="filtros-row">
            <select id="filtro-marca" class="filtro-select"></select>
            <select id="filtro-rubro" class="filtro-select"></select>
            <select id="filtro-talle" class="filtro-select"></select>
          </div>
        </div>
      </section>

      <div class="main-row">
        <section class="results-card">
          <div class="results-header">
            <div class="results-title">Resultados</div>
            <div class="results-status" id="results-status">Esperando consulta</div>
          </div>
          <div id="results-container"></div>
        </section>

        <section class="dashboard-card">
          <div class="dashboard-header">
            <div class="dashboard-title">Visión rápida</div>
            <div class="dashboard-subtitle">Distribución por talle</div>
          </div>
          <canvas id="stockChart"></canvas>
        </section>
      </div>

    </div>
  </div>

  <div id="loading-overlay"><div id="loading-text">Buscando…</div></div>

  <div id="admin-panel">
    <h2>Configuración del ORB</h2>

    <label>Color Día</label>
    <input type="color" id="orb-color-dia" />

    <label>Color Noche</label>
    <input type="color" id="orb-color-noche" />

    <label>Tamaño del ORB</label>
    <input type="range" id="orb-size" min="60" max="200" />

    <label>Intensidad del Pulso</label>
    <input type="range" id="orb-pulse" min="1" max="10" />

    <label>Velocidad del Giro</label>
    <input type="range" id="orb-spin" min="1" max="10" />

    <label>Posición del ORB</label>
    <select id="orb-pos">
      <option value="left">Izquierda</option>
      <option value="center" selected>Centrado</option>
      <option value="floating">Flotante</option>
    </select>

    <label>Tamaño del modo centrado</label>
    <select id="orb-center-size">
      <option value="b1">Pequeño (B1)</option>
      <option value="b2" selected>Medio (B2)</option>
      <option value="b3">Grande (B3)</option>
    </select>

    <button id="admin-save">Guardar</button>
    <button id="admin-close">Cerrar</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>

</body>
</html>
