<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Stock IA PRO v3.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<style>
:root {
    --bg: #050816;
    --bg-elevated: #0b1020;
    --accent: #4f46e5;
    --accent-strong: #6366f1;
    --text: #e5e7eb;
    --text-soft: #9ca3af;
    --danger: #ef4444;
    --success: #22c55e;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-pill: 999px;
    --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.75);
}
body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", sans-serif;
    background: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
    color: var(--text);
    display: flex;
    justify-content: center;
}
.app-shell {
    width: 100%;
    max-width: 1200px;
    margin: 24px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 18px;
}
.app-main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 18px;
}
.panel {
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.9));
    border-radius: var(--radius-lg);
    border: 1px solid rgba(148, 163, 184, 0.25);
    box-shadow: var(--shadow-soft);
    padding: 18px;
}
.orb {
    width: 82px; height: 82px; border-radius: 999px;
    background: radial-gradient(circle at 50% 50%, #4f46e5, #111827 70%);
    animation: orb-breathe 3.8s ease-in-out infinite;
}
@keyframes orb-breathe {0%{transform:scale(0.96);}50%{transform:scale(1.04);}100%{transform:scale(0.96);}}
@keyframes spin {from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.input-shell {
    display:flex; gap:8px; background:rgba(15,23,42,0.9);
    border-radius:12px; border:1px solid rgba(148,163,184,0.45); padding:10px 14px;
}
#queryInput {flex:1; border:none; outline:none; background:transparent; color:var(--text); font-size:1rem;}
.icon-bar button {font-size:1.2rem; padding:10px 14px;}
.response-shell {background:rgba(15,23,42,0.9); border-radius:var(--radius-md); padding:10px; min-height:120px;}
.view-hidden {display:none;}
.pill-dot {width:8px; height:8px; border-radius:999px; background:var(--danger);}
.pill-dot.ok {background:var(--success);}
@media(max-width:768px){
    .app-main{grid-template-columns:1fr;}
    .panel{padding:14px;}
    .icon-bar{flex-wrap:wrap; justify-content:space-between;}
    .icon-bar .btn{flex:1 1 30%; text-align:center;}
}
</style>
</head>
<body>
<div class="app-shell">
<header class="app-header">
    <div class="brand"><div class="brand-logo"></div><div><div class="brand-text-title">Stock IA PRO v3.1</div></div></div>
    <div class="header-right">
        <button id="btnTheme" class="toggle-theme">Modo claro/oscuro</button>
        <div class="pill"><span class="pill-dot" id="statusDot"></span><span id="statusText">Sistema desconectado</span></div>
    </div>
</header>

<main class="app-main">
    <!-- PANEL IZQUIERDO -->
    <section class="panel">
        <div class="orb-wrapper"><div class="orb" id="orbStatus"></div></div>
        <div class="input-shell"><span class="input-prefix">¿Qué stock hay de…?</span>
            <input id="queryInput" type="text" placeholder="pantuflas avengers plush" />
            <button id="btnSend" class="btn btn-primary">Consultar</button>
        </div>
        <div class="icon-bar">
            <button id="btnSpeak" class="btn">🎤</button>
            <button id="btnHandsFree" class="btn">🎧</button>
            <button id="btnStop" class="btn">⏹</button>
            <button id="btnClear" class="btn">🧹</button>
            <button id="btnCopy" class="btn">📋</button>
            <button id="btnScanner" class="btn">📷</button>
        </div>
        <div class="toggle-row"><label class="switch"><input type="checkbox" id="chkSoloStock" checked /><span class="slider"></span></label><span>Mostrar solo artículos con stock</span></div>
        <div class="history-shell"><div>Historial:</div><ul id="historyList"></ul></div>
    </section>

    <!-- PANEL DERECHO -->
    <section class="panel">
        <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
            <button id="btnViewCards" class="btn btn-primary">Tarjetas</button>
            <button id="btnViewList" class="btn">Lista</button>
            <button id="btnViewTable" class="btn">Tabla</button>
            <button id="btnViewDashboard" class="btn">Dashboard</button>
            <button id="btnViewAdmin" class="btn">Admin</button>
        </div>
        <div id="viewCards" class="response-shell"><div id="cardsContainer">Listo para responder.</div></div>
        <div id="viewList" class="response-shell view-hidden"><ul id="listContainer"></ul></div>
        <div id="viewTable" class="response-shell view-hidden"><table><tbody id="tableContainer"></tbody></table></div>
        <div id="viewDashboard" class="response-shell view-hidden"><div id="dashboardContainer"></div></div>
        <div id="viewAdmin" class="response-shell view-hidden">
            <h4>Panel Admin</h4>
            <button onclick="setModel('vendedor_experto')">Vendedor experto</button>
            <button onclick="setModel('amigable')">Amigable</button>
            <button onclick="setModel('profesional')">Profesional</button>
            <button onclick="setModel('minimalista')">Minimalista</button>
            <button onclick="setModel('tecnico')">Técnico</button>
            <pre id="jsonView"></pre>
        </div>
    </section>
</main>
</div>

<div id="scannerOverlay" class="scanner-overlay"><div class="scanner-inner"><video id="scannerVideo" autoplay playsinline muted></video><button id="btnCloseScanner" class="btn">Cerrar</button></div></div>
<audio id="beepSound"><source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=" type="audio/wav"></audio>
<audio id="responseVoice" style="display:none;"></audio>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script>
// ==================================================
// CONFIGURACIÓN BACKEND
// ==================================================
const BACKEND = "https://stock-backend-1-0upi.onrender.com";

// ==================================================
// REFERENCIAS DOM
// ==================================================
const input = document.getElementById("queryInput");
const btnSend = document.getElementById("btnSend");
const autocompleteList = document.getElementById("autocompleteList");
const orbStatus = document.getElementById("orbStatus");
const responseVoice = document.getElementById("responseVoice");

const btnSpeak = document.getElementById("btnSpeak");
const btnHandsFree = document.getElementById("btnHandsFree");
const btnStop = document.getElementById("btnStop");
const btnClear = document.getElementById("btnClear");
const btnCopy = document.getElementById("btnCopy");
const btnScanner = document.getElementById("btnScanner");

const chkSoloStock = document.getElementById("chkSoloStock");
const historyList = document.getElementById("historyList");

const btnViewCards = document.getElementById("btnViewCards");
const btnViewList = document.getElementById("btnViewList");
const btnViewTable = document.getElementById("btnViewTable");
const btnViewDashboard = document.getElementById("btnViewDashboard");
const btnViewAdmin = document.getElementById("btnViewAdmin");

const viewCards = document.getElementById("viewCards");
const viewList = document.getElementById("viewList");
const viewTable = document.getElementById("viewTable");
const viewDashboard = document.getElementById("viewDashboard");
const viewAdmin = document.getElementById("viewAdmin");

const cardsContainer = document.getElementById("cardsContainer");
const listContainer = document.getElementById("listContainer");
const tableContainer = document.getElementById("tableContainer");
const dashboardContainer = document.getElementById("dashboardContainer");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

const scannerOverlay = document.getElementById("scannerOverlay");
const scannerVideo = document.getElementById("scannerVideo");
const btnCloseScanner = document.getElementById("btnCloseScanner");

const beepSound = document.getElementById("beepSound");

// ==================================================
// ESTADO
// ==================================================
let recognition = null;
let handsFreeMode = false;
let lastResults = [];
let zxingReader = null;
let orbTapCount = 0;
let orbTimer = null;

// ==================================================
// TEMA CLARO/OSCURO
// ==================================================
document.getElementById("btnTheme").addEventListener("click", () => {
    document.body.classList.toggle("light");
});

// ==================================================
// AUTOCOMPLETE
// ==================================================
let autocompleteTimeout = null;

input.addEventListener("input", () => {
    const q = input.value.trim();
    if (!q) {
        autocompleteList.style.display = "none";
        autocompleteList.innerHTML = "";
        return;
    }
    if (autocompleteTimeout) clearTimeout(autocompleteTimeout);

    autocompleteTimeout = setTimeout(() => {
        fetch(`${BACKEND}/autocomplete?q=${encodeURIComponent(q)}`)
            .then(r => r.ok ? r.json() : [])
            .then(data => {
                autocompleteList.innerHTML = "";
                if (!data?.suggestions?.length) {
                    autocompleteList.style.display = "none";
                    return;
                }
                data.suggestions.forEach(s => {
                    const li = document.createElement("li");
                    li.className = "autocomplete-item";
                    li.textContent = s;
                    li.onclick = () => {
                        input.value = s;
                        autocompleteList.style.display = "none";
                    };
                    autocompleteList.appendChild(li);
                });
                autocompleteList.style.display = "block";
            })
            .catch(() => autocompleteList.style.display = "none");
    }, 250);
});

// ==================================================
// NORMALIZAR TEXTO (acentos, variantes)
// ==================================================
function normalizarTexto(t) {
    return t
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}
// ==================================================
// CONSULTA PRINCIPAL
// ==================================================
async function consultar() {
    let q = input.value.trim();
    if (!q) return;

    if (q.toLowerCase() === "admin") {
        activarAdmin();
        return;
    }

    const qNorm = normalizarTexto(q);

    orbStatus.style.animation = "spin 1s linear infinite";
    cardsContainer.textContent = "Consultando...";
    listContainer.innerHTML = "";
    tableContainer.innerHTML = "";
    dashboardContainer.innerHTML = "";

    try {
        const params = new URLSearchParams();
        params.set("q", qNorm);
        params.set("solo_stock", chkSoloStock.checked ? "1" : "0");

        const resp = await fetch(`${BACKEND}/query?${params.toString()}`);
        if (!resp.ok) throw new Error("Backend error");

        const data = await resp.json();
        lastResults = data.items || [];

        renderCards(lastResults);
        renderList(lastResults);
        renderTable(lastResults);
        renderDashboard(lastResults);

        addToHistory(q);

        // TTS inteligente
        let tts = data.tts;
        if (!tts) {
            if (lastResults.length === 0) {
                tts = `No encontré resultados para ${q}.`;
            } else {
                tts = `Encontré ${lastResults.length} artículos. El primero es ${lastResults[0].descripcion}.`;
            }
        }
        speakText(tts);

    } catch (e) {
        cardsContainer.textContent = "Error al consultar el backend.";
        speakText("Hubo un error al consultar el servidor.");
    } finally {
        orbStatus.style.animation = "orb-breathe 3.8s ease-in-out infinite";
    }
}

btnSend.onclick = consultar;
input.onkeydown = e => { if (e.key === "Enter") consultar(); };

// ==================================================
// RENDERIZADO
// ==================================================
function stockTotal(it) {
    return (it.talles || []).reduce((a, t) => a + (parseFloat(t.stock) || 0), 0);
}

function renderCards(items) {
    if (!items.length) {
        cardsContainer.textContent = "No se encontraron resultados.";
        return;
    }
    cardsContainer.innerHTML = "";
    items.forEach(it => {
        const div = document.createElement("div");
        div.className = "dashboard-card";
        div.innerHTML = `
            <div class="dashboard-label">${it.codigo}</div>
            <div class="dashboard-value">${it.descripcion}</div>
            <div style="margin-top:6px; font-size:0.75rem;">
                Marca: ${it.marca}<br>
                Rubro: ${it.rubro}<br>
                Precio: $${it.precio}<br>
                Stock total: ${stockTotal(it)}<br>
                Talles: ${(it.talles||[]).map(t=>`${t.talle} (${t.stock})`).join(", ")}
            </div>`;
        cardsContainer.appendChild(div);
    });
}

function renderList(items) {
    listContainer.innerHTML = "";
    items.forEach(it => {
        const li = document.createElement("li");
        li.innerHTML = `<strong>${it.codigo}</strong> - ${it.descripcion}<br>Stock total: ${stockTotal(it)}`;
        listContainer.appendChild(li);
    });
}

function renderTable(items) {
    tableContainer.innerHTML = "";
    items.forEach(it => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${it.codigo}</td>
            <td>${it.descripcion}</td>
            <td style="text-align:right;">${stockTotal(it)}</td>`;
        tableContainer.appendChild(tr);
    });
}

function renderDashboard(items) {
    dashboardContainer.innerHTML = "";
    const total = items.length;
    const conStock = items.filter(i => stockTotal(i) > 0).length;
    const unidades = items.reduce((a, i) => a + stockTotal(i), 0);

    const stats = [
        ["Artículos encontrados", total],
        ["Con stock", conStock],
        ["Unidades totales", unidades]
    ];

    stats.forEach(([label, value]) => {
        const div = document.createElement("div");
        div.className = "dashboard-card";
        div.innerHTML = `<div class="dashboard-label">${label}</div><div class="dashboard-value">${value}</div>`;
        dashboardContainer.appendChild(div);
    });
}

// ==================================================
// CAMBIO DE VISTA
// ==================================================
function setView(v) {
    [viewCards, viewList, viewTable, viewDashboard, viewAdmin].forEach(vw => vw.classList.add("view-hidden"));
    [btnViewCards, btnViewList, btnViewTable, btnViewDashboard, btnViewAdmin].forEach(b => b.classList.remove("btn-primary"));

    if (v === "cards") { viewCards.classList.remove("view-hidden"); btnViewCards.classList.add("btn-primary"); }
    if (v === "list") { viewList.classList.remove("view-hidden"); btnViewList.classList.add("btn-primary"); }
    if (v === "table") { viewTable.classList.remove("view-hidden"); btnViewTable.classList.add("btn-primary"); }
    if (v === "dashboard") { viewDashboard.classList.remove("view-hidden"); btnViewDashboard.classList.add("btn-primary"); }
    if (v === "admin") { viewAdmin.classList.remove("view-hidden"); btnViewAdmin.classList.add("btn-primary"); }
}

btnViewCards.onclick = () => setView("cards");
btnViewList.onclick = () => setView("list");
btnViewTable.onclick = () => setView("table");
btnViewDashboard.onclick = () => setView("dashboard");
btnViewAdmin.onclick = () => setView("admin");

setView("cards");

// ==================================================
// HISTORIAL
// ==================================================
function addToHistory(q) {
    const li = document.createElement("li");
    li.textContent = q;
    li.onclick = () => { input.value = q; consultar(); };
    historyList.prepend(li);
}

// ==================================================
// VOZ
// ==================================================
function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const rec = new SR();
    rec.lang = "es-AR";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    return rec;
}

function beep() {
    beepSound.currentTime = 0;
    beepSound.play().catch(()=>{});
}

btnSpeak.onclick = () => {
    beep();
    if (!recognition) recognition = initRecognition();
    handsFreeMode = false;
    recognition.onresult = e => { input.value = e.results[0][0].transcript; consultar(); };
    recognition.start();
};

btnHandsFree.onclick = () => {
    beep();
    if (!recognition) recognition = initRecognition();
    handsFreeMode = true;
    let lastSpeech = Date.now();

    recognition.onresult = e => {
        lastSpeech = Date.now();
        input.value = e.results[0][0].transcript;
        consultar();
    };

    recognition.onend = () => {
        if (!handsFreeMode) return;
        if (Date.now() - lastSpeech > 60000) {
            handsFreeMode = false;
            alert("No detecté voz por un rato. Desactivo manos libres.");
            return;
        }
        recognition.start();
    };

    recognition.start();
};

btnStop.onclick = () => {
    beep();
    handsFreeMode = false;
    if (recognition) {
        recognition.onend = null;
        recognition.stop();
    }
    speechSynthesis.cancel();
};

function speakText(t) {
    if (!t) return;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "es-AR";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}

// ==================================================
// UTILIDADES
// ==================================================
btnClear.onclick = () => {
    input.value = "";
    cardsContainer.textContent = "Listo para responder.";
    listContainer.innerHTML = "";
    tableContainer.innerHTML = "";
    dashboardContainer.innerHTML = "";
};

btnCopy.onclick = async () => {
    try {
        await navigator.clipboard.writeText(cardsContainer.innerText);
        alert("Resultado copiado.");
    } catch {
        alert("No se pudo copiar.");
    }
};
// ==================================================
// SCANNER ZXING
// ==================================================
btnScanner.onclick = async () => {
    try {
        scannerOverlay.style.display = "flex";

        zxingReader = new ZXing.BrowserMultiFormatReader();

        const devices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
        const backCam = devices.find(d => d.label.toLowerCase().includes("back")) || devices[0];

        zxingReader.decodeFromVideoDevice(backCam.deviceId, "scannerVideo", (result, err) => {
            if (result) {
                input.value = result.text;
                cerrarScanner();
                consultar();
            }
        });
    } catch (e) {
        alert("No se pudo iniciar el scanner.");
        cerrarScanner();
    }
};

function cerrarScanner() {
    scannerOverlay.style.display = "none";
    if (zxingReader) {
        zxingReader.reset();
        zxingReader = null;
    }
}
btnCloseScanner.onclick = cerrarScanner;

// ==================================================
// ADMIN TAB
// ==================================================
function activarAdmin() {
    alert("Modo administrador activado");
    setView("admin");
}

function setModel(m) {
    localStorage.setItem("modelo_respuesta", m);
    alert("Modelo cambiado a: " + m);
}

function mostrarJSON() {
    document.getElementById("jsonView").textContent = JSON.stringify(lastResults, null, 2);
}
setInterval(mostrarJSON, 1000);

// ==================================================
// ORB + ADMIN POR TOQUES
// ==================================================
orbStatus.onclick = () => {
    orbTapCount++;
    if (orbTimer) clearTimeout(orbTimer);
    orbTimer = setTimeout(() => orbTapCount = 0, 800);

    if (orbTapCount >= 5) {
        orbTapCount = 0;
        activarAdmin();
    }
};

// ==================================================
// ESTADO BACKEND
// ==================================================
async function checkBackendStatus() {
    try {
        const r = await fetch(`${BACKEND}/health`);
        if (r.ok) {
            statusDot.classList.add("ok");
            statusText.textContent = "Sistema conectado";
        } else {
            statusDot.classList.remove("ok");
            statusText.textContent = "Sistema con problemas";
        }
    } catch {
        statusDot.classList.remove("ok");
        statusText.textContent = "Sistema desconectado";
    }
}
checkBackendStatus();
setInterval(checkBackendStatus, 15000);
</script>
</body>
</html>
