<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORB STOCK — Premium UI</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <!-- ORB SIEMPRE VISIBLE -->
    <div id="orb-container">
        <div id="orb"></div>
    </div>

    <!-- OVERLAY DE BÚSQUEDA -->
    <div id="loading-overlay">
        <div id="loading-text">Buscando…</div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app-container">

        <!-- HEADER SUPERIOR -->
        <header id="top-bar">
            <div id="logo">ORB STOCK</div>

            <div id="top-actions">
                <button id="toggle-dark">Modo Día/Noche</button>
                <button id="open-admin">Admin</button>
                <button id="toggle-voice">Voz</button>
            </div>
        </header>

        <!-- PANEL DE BÚSQUEDA -->
        <section id="search-panel">
            <input id="search-input" type="text" placeholder="Buscar artículo, marca o rubro…" />
            <button id="search-btn">Buscar</button>
            <label class="checkbox">
                <input type="checkbox" id="solo-stock" />
                Mostrar solo con stock
            </label>
        </section>

        <!-- DASHBOARD -->
        <section id="dashboard">
            <div class="dash-card">
                <h3>ARTÍCULOS</h3>
                <p id="dash-articulos">0</p>
            </div>
            <div class="dash-card">
                <h3>PARES</h3>
                <p id="dash-pares">0</p>
            </div>
            <div class="dash-card">
                <h3>ALERTAS</h3>
                <p id="dash-alertas">0</p>
            </div>
            <div class="dash-card">
                <h3>VALORIZADO</h3>
                <p id="dash-valorizado">$0</p>
            </div>
        </section>

        <!-- RESULTADOS -->
        <section id="results-container">
            <h2 id="results-title">Resultados</h2>
            <div id="results-list"></div>
        </section>

    </div>

    <!-- PANEL ADMINISTRADOR -->
    <div id="admin-panel">
        <h2>Configuración del ORB</h2>

        <label>Color Día</label>
        <input type="color" id="orb-color-dia" />

        <label>Color Noche</label>
        <input type="color" id="orb-color-noche" />

        <label>Tamaño del ORB</label>
        <input type="range" id="orb-size" min="60" max="200" />

        <label>Intensidad del Pulso</label>
        <input type="range" id="orb-pulse" min="1" max="10" />

        <label>Velocidad del Giro</label>
        <input type="range" id="orb-spin" min="1" max="10" />

        <label>
            <input type="checkbox" id="orb-halo" checked />
            Halo Activo
        </label>

        <label>
            <input type="checkbox" id="orb-respiracion" checked />
            Respiración Activa
        </label>

        <label>
            <input type="checkbox" id="orb-overlay" checked />
            Overlay de Búsqueda
        </label>

        <label>
            <input type="checkbox" id="orb-voz" checked />
            Voz Activa
        </label>

        <button id="admin-save">Guardar</button>
        <button id="admin-close">Cerrar</button>
    </div>

    <script src="backend.js"></script>
    <script src="voz.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>

</body>
</html>
