<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOCK IA PRO — Asistente inteligente</title>

  <!-- Estilos principales -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="orb.css" />
</head>

<body class="orb-center orb-b2">

  <!-- Banner temporal de versión -->
  <div style="background:#d60000;color:white;padding:10px;font-size:18px;text-align:center;">
    VERSION RESTAURADA — PASO 1 (ESTRUCTURA BASE)
  </div>

  <div class="app-shell">
    <div class="app-container">

      <!-- ENCABEZADO -->
      <div class="app-header">
        <div class="branding">
          <div>
            <div class="brand-title">STOCK IA PRO</div>
            <div class="brand-subtitle">Asistente inteligente de stock</div>
          </div>
        </div>

        <div class="header-right">
          <div class="connection-indicator">
            <div class="connection-dot"></div>
            <span>Estado conexión</span>
          </div>
        </div>
      </div>

      <!-- ORB -->
      <div class="orb-zone">
        <div class="orb-wrapper">
          <div class="orb" id="orb">IA PRO</div>
          <div class="orb-tooltip" id="orb-tooltip">
            <span class="orb-tooltip-arrow"></span>
            <span class="orb-tooltip-text">Tocá para buscar</span>
          </div>
        </div>
      </div>

      <!-- BUSCADOR -->
      <section class="search-card">
        <div class="search-row">

          <div class="search-input-wrapper">
            <input
              id="search-input"
              class="search-input"
              type="text"
              placeholder="Buscar artículo, marca o rubro…"
              autocomplete="off"
            />
          </div>

          <!-- Scanner avanzado (único activo) -->
          <button id="btn-scanner-nativo" class="scanner-btn" title="Lector avanzado">📱</button>

          <!-- Modo simple / completo -->
          <div class="scanner-mode-switch">
            <div id="scanner-mode-simple" class="scanner-mode-option active">Simple</div>
            <div id="scanner-mode-completo" class="scanner-mode-option">Completo</div>
          </div>

        </div>
      </section>

      <!-- CONTENIDO PRINCIPAL -->
      <div class="main-row">

        <!-- RESULTADOS -->
        <section class="results-card">
          <div class="results-header">
            <div class="results-title">Resultados</div>
            <div class="results-status" id="results-status">Esperando consulta</div>
          </div>

          <div id="results-container"></div>
        </section>

        <!-- DASHBOARD -->
        <section class="dashboard-card">
          <div class="dashboard-header">
            <div class="dashboard-title">Visión rápida</div>
            <div class="dashboard-subtitle">Distribución por talle</div>
          </div>
          <canvas id="stockChart"></canvas>
        </section>

      </div>

    </div>
  </div>

  <!-- Scripts principales -->
  <script src="ui.js"></script>
  <script src="scanner.js"></script>
  <script src="app_v2.js"></script>

</body>
</html>
