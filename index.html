<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOCK IA PRO — Scanner en vivo</title>

  <link rel="stylesheet" href="orb.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* 🔥 Ajuste definitivo para evitar zoom, recortes y lecturas incorrectas */
    #scanner-container {
      position: relative;
      width: 100%;
      height: auto;          /* El contenedor se adapta al video */
      background: black;
      overflow: visible;     /* NO recortar el video */
    }

    #scanner-container video,
    #scanner-container canvas {
      width: 100% !important;   /* Mantiene proporción real */
      height: auto !important;  /* NO estirar vertical */
      object-fit: contain !important;
      transform: none !important;
      position: relative;
    }
  </style>
</head>

<body class="orb-center orb-b2">

  <div style="background:red;color:white;padding:10px;font-size:20px;">
    VERSION TEST 999 — SCANNER MIXTO FINAL
  </div>

  <div class="app-shell">
    <div class="app-container">

      <div class="app-header">
        <div class="branding">
          <div>
            <div class="brand-title">STOCK IA PRO</div>
            <div class="brand-subtitle">Asistente inteligente de stock</div>
          </div>
        </div>

        <div class="header-right">
          <div class="connection-indicator">
            <div class="connection-dot"></div>
            <span>Estado conexión</span>
          </div>
        </div>
      </div>

      <section class="search-card">
        <div class="search-row">

          <div class="search-input-wrapper">
            <input
              id="search-input"
              class="search-input"
              type="text"
              placeholder="Buscar artículo, marca o rubro…"
              autocomplete="off"
            />
          </div>

          <!-- BOTÓN SCAN WEB -->
          <button id="btn-scanner" class="scanner-btn" title="Escanear">📸</button>

          <!-- BOTÓN SCAN NATIVO -->
          <button id="btn-scanner-nativo" class="scanner-btn" title="Lector avanzado">📱</button>

          <div class="scanner-mode-switch">
            <div id="scanner-mode-simple" class="scanner-mode-option active">Simple</div>
            <div id="scanner-mode-completo" class="scanner-mode-option">Completo</div>
          </div>

        </div>
      </section>

      <div class="main-row">
        <section class="results-card">
          <div class="results-header">
            <div class="results-title">Resultados</div>
            <div class="results-status" id="results-status">Esperando consulta</div>
          </div>

          <div id="results-container"></div>
        </section>
      </div>

    </div>
  </div>

  <!-- ⭐ OVERLAY SCANNER WEB (CORREGIDO) -->
  <div id="scanner-overlay" style="
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
  ">
    <div style="
      width:90%;
      max-width:420px;
      max-height:90vh;      /* NO altura fija */
      background:rgba(0,0,0,0.9);
      border-radius:16px;
      border:2px solid #00e0ff;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:visible;
    ">

      <div style="
        position:absolute;
        inset:15%;
        border:2px solid rgba(0,224,255,0.8);
        border-radius:12px;
        box-shadow:0 0 20px rgba(0,224,255,0.6);
        pointer-events:none;
        z-index:2;
      "></div>

      <div id="scanner-container"></div>

      <button id="scanner-close" style="
        position:absolute;
        bottom:10px;
        left:50%;
        transform:translateX(-50%);
        padding:10px 20px;
        font-size:16px;
        background:rgba(0,0,0,0.7);
        color:white;
        border:1px solid #fff;
        border-radius:999px;
        z-index:3;
      ">
        Cancelar
      </button>
    </div>
  </div>

  <!-- QUAGGA2 -->
  <script src="https://unpkg.com/@ericblade/quagga2@1.2.6/dist/quagga.js"></script>

  <script src="scanner.js"></script>
  <script src="ui.js"></script>

</body>
</html>
