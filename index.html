<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Consulta de Stock</title>

  <style>
    :root {
      --color-primario: #007bff;
      --color-fondo: #f0f2f5;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: var(--color-fondo);
      color: #222;
      max-width: 600px;
      margin: auto;
      position: relative;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }

    #consultarBtn {
      background: var(--color-primario);
      color: white;
    }

    #hablarBtn {
      background: #ffcc00;
    }

    #respuesta {
      margin-top: 1.5rem;
      padding: 1rem;
      background: white;
      border-radius: 6px;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      font-size: 1.1rem;
    }

    /* Versión sutil */
    #version {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 0.75rem;
      opacity: 0.45;
      color: #444;
      user-select: none;
    }
  </style>
</head>

<body>
  <h1>Consulta de Stock</h1>

  <input id="pregunta" type="text" placeholder="Escribí tu consulta..." />

  <button id="consultarBtn" onclick="consultar()">Consultar</button>
  <button id="hablarBtn" onclick="escuchar()">🎤 Hablar</button>

  <div id="respuesta"></div>

  <!-- Versión -->
  <div id="version">v1.0.1</div>

  <script>
    // ============================
    // FORMATEAR PESOS ARGENTINOS
    // ============================
    function formatearARS(texto) {
      return texto.replace(/\$([0-9.,]+)/g, (match, num) => {
        let limpio = num.replace(/,/g, "");
        let valor = parseFloat(limpio);
        if (isNaN(valor)) return match;

        return "$" + valor.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      });
    }

    // ============================
    // CONSULTAR BACKEND
    // ============================
    async function consultar() {
      const pregunta = document.getElementById("pregunta").value;
      const respuestaDiv = document.getElementById("respuesta");

      if (!pregunta.trim()) {
        respuestaDiv.textContent = "Escribí una consulta primero.";
        return;
      }

      respuestaDiv.textContent = "Consultando...";

      try {
        const res = await fetch("https://stock-backend-1-twzg.onrender.com/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: pregunta })
        });

        const data = await res.json();

        if (data.respuesta) {
          let texto = formatearARS(data.respuesta);

          // Mostrar en pantalla
          let textoPantalla = texto;

          if (data.fuente) {
            textoPantalla += `\n\nFuente:\nArchivo: ${data.fuente.archivo}\nFecha: ${data.fuente.fecha}`;
          }

          respuestaDiv.textContent = textoPantalla;

          // Usar texto limpio para voz
          if (data.voz) {
            hablar(data.voz);
          }

        } else {
          respuestaDiv.textContent = "No se encontró información.";
          hablar("No se encontró información.");
        }

      } catch (err) {
        respuestaDiv.textContent = "Error al consultar el backend.";
        hablar("Hubo un error al consultar el sistema.");
      }
    }

    // ============================
    // RECONOCIMIENTO DE VOZ
    // ============================
    function escuchar() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Tu navegador no soporta reconocimiento de voz.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "es-AR";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      document.getElementById("respuesta").textContent = "Escuchando...";

      recognition.start();

      recognition.onresult = (event) => {
        const texto = event.results[0][0].transcript;
        document.getElementById("pregunta").value = texto;
        consultar();
      };

      recognition.onerror = (event) => {
        document.getElementById("respuesta").textContent =
          "Error al escuchar: " + event.error;
      };
    }

    // ============================
    // SÍNTESIS DE VOZ (SIN DÓLARES)
    // ============================
    function hablar(texto) {
      const utter = new SpeechSynthesisUtterance(texto);
      utter.lang = "es-AR";
      utter.rate = 1;
      utter.pitch = 1;
      speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
