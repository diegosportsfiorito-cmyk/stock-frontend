<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock IA</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        header {
            background: #1e1e1e;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .version {
            font-size: 12px;
            opacity: 0.6;
        }

        main {
            padding: 20px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #222;
            color: #fff;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #666;
        }

        #responseContainer {
            margin-top: 20px;
        }

        .card {
            background: #1b1b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
        }

        .card-details {
            margin-top: 10px;
            display: none;
        }

        .table-desktop {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .table-desktop th, .table-desktop td {
            border: 1px solid #333;
            padding: 6px;
            text-align: center;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .chip {
            background: #333;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        #scannerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #scannerVideo {
            width: 80%;
            border-radius: 10px;
            border: 2px solid #fff;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Stock IA</h1>
        <span class="version">v1.0.0</span>
    </header>

    <main>

        <div class="input-container">
            <input id="questionInput" type="text" placeholder="Escribe o escanea un código..." autofocus />

            <button id="sendBtn">Enviar</button>
            <button id="scanBtn">📷</button>
            <button id="micBtn">🎤</button>
        </div>

        <div id="scannerContainer" class="hidden">
            <video id="scannerVideo" autoplay></video>
            <button id="closeScanner">Cerrar</button>
        </div>

        <div id="responseContainer"></div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

    <script>
        const input = document.getElementById("questionInput");
        const sendBtn = document.getElementById("sendBtn");
        const scanBtn = document.getElementById("scanBtn");
        const micBtn = document.getElementById("micBtn");
        const responseContainer = document.getElementById("responseContainer");

        const scannerContainer = document.getElementById("scannerContainer");
        const scannerVideo = document.getElementById("scannerVideo");
        const closeScanner = document.getElementById("closeScanner");

        let scanning = false;

        // ============================================================
        // ENVIAR CONSULTA
        // ============================================================

        sendBtn.onclick = () => enviarConsulta();
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") enviarConsulta();
        });

        function enviarConsulta() {
            const question = input.value.trim();
            if (!question) return;

            fetch("https://stock-backend-1-twzg.onrender.com/query", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({question})
            })
            .then(r => r.json())
            .then(data => renderRespuesta(data))
            .catch(err => console.error(err));
        }

        // ============================================================
        // RENDER DE RESPUESTA
        // ============================================================

        function renderRespuesta(data) {
            responseContainer.innerHTML = "";

            if (data.tipo === "producto") {
                responseContainer.appendChild(renderProducto(data.data));
            }

            if (data.tipo === "lista") {
                data.lista.forEach(item => {
                    responseContainer.appendChild(renderProducto(item));
                });
            }

            if (data.tipo === "marca_resumen" || data.tipo === "rubro_resumen") {
                responseContainer.appendChild(renderResumen(data.data));
            }
        }

        // ============================================================
        // TARJETA DE PRODUCTO
        // ============================================================

        function renderProducto(p) {
            const card = document.createElement("div");
            card.className = "card";

            const header = document.createElement("div");
            header.className = "card-header";

            header.innerHTML = `
                <div>
                    <div class="card-title">${p.descripcion}</div>
                    <div>${p.marca} — ${p.rubro}</div>
                    <div>Stock total: ${p.stock_total}</div>
                </div>
                <button class="toggleBtn">Detalles</button>
            `;

            const details = document.createElement("div");
            details.className = "card-details";

            const chips = document.createElement("div");
            chips.className = "chips";
            p.talles.forEach(t => {
                const chip = document.createElement("div");
                chip.className = "chip";
                chip.textContent = `${t.talle} (${t.stock})`;
                chips.appendChild(chip);
            });

            const table = document.createElement("table");
            table.className = "table-desktop";
            table.innerHTML = `
                <tr><th>Talle</th><th>Stock</th></tr>
                ${p.talles.map(t => `<tr><td>${t.talle}</td><td>${t.stock}</td></tr>`).join("")}
            `;

            details.appendChild(chips);
            details.appendChild(table);

            header.querySelector(".toggleBtn").onclick = () => {
                details.style.display = details.style.display === "none" ? "block" : "none";
            };

            card.appendChild(header);
            card.appendChild(details);

            return card;
        }

        // ============================================================
        // RESUMEN POR MARCA / RUBRO
        // ============================================================

        function renderResumen(r) {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="card-title">${r.marca || r.rubro}</div>
                <div>Stock total: ${r.stock_total}</div>
                <div>Valorizado total: ${r.valorizado_total}</div>
            `;

            return card;
        }

        // ============================================================
        // SCANNER DE CÓDIGOS DE BARRA
        // ============================================================

        scanBtn.onclick = () => iniciarScanner();
        closeScanner.onclick = () => detenerScanner();

        function iniciarScanner() {
            scannerContainer.classList.remove("hidden");

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: scannerVideo
                },
                decoder: {
                    readers: ["ean_reader", "ean_8_reader", "code128_reader"]
                }
            }, function(err) {
                if (err) {
                    console.error(err);
                    return;
                }
                Quagga.start();
                scanning = true;
            });

            Quagga.onDetected(data => {
                if (!scanning) return;
                scanning = false;

                const code = data.codeResult.code;
                input.value = code;
                detenerScanner();
                enviarConsulta();
            });
        }

        function detenerScanner() {
            scannerContainer.classList.add("hidden");
            if (scanning) {
                Quagga.stop();
                scanning = false;
            }
        }
    </script>

</body>
</html>
