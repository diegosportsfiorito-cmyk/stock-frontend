<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock IA</title>

    <!-- ============================
         CSS PREMIUM
    ============================= -->
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* ============================
           TABS
        ============================= */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #222;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .tab.active {
            background: #4a90e2;
        }

        .tab:hover {
            background: #333;
        }

        /* ============================
           DASHBOARD SELECTOR
        ============================= */
        .dashboard-selector {
            margin-bottom: 20px;
            font-size: 16px;
            color: #ddd;
        }

        .dashboard-selector label {
            margin-right: 20px;
            cursor: pointer;
        }

        /* ============================
           TARJETAS
        ============================= */
        .dashboard-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            color: #fff;
            flex: 1;
            min-width: 180px;
            box-shadow: 0 0 10px #0004;
            font-size: 18px;
        }

        /* ============================
           GRÁFICOS
        ============================= */
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        canvas {
            background: #111;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- ============================
     TABS (BUSCAR / DASHBOARD)
============================= -->
<div class="tabs">
    <button id="tabBuscar" class="tab active">Buscar</button>
    <button id="tabDashboard" class="tab">Dashboard</button>
</div>

<!-- ============================
     VISTA BUSCAR (PEGÁ AQUÍ TU BUSCADOR)
============================= -->
<div id="vistaBuscar">

    <!-- 🔵 PEGÁ AQUÍ TODO TU BUSCADOR ANTERIOR -->
    <!-- Input, botones, scanner, voz, historial, resultados, etc. -->

</div>

<!-- ============================
     VISTA DASHBOARD
============================= -->
<div id="vistaDashboard" style="display:none;">

    <!-- Selector Global / Última búsqueda -->
    <div class="dashboard-selector">
        <label><input type="radio" name="modoDashboard" value="global" checked> Métricas globales</label>
        <label><input type="radio" name="modoDashboard" value="busqueda"> Métricas de la búsqueda actual</label>
    </div>

    <!-- Tarjetas -->
    <div class="dashboard-cards">
        <div class="card" id="cardStockTotal"></div>
        <div class="card" id="cardArticulos"></div>
        <div class="card" id="cardRubro"></div>
        <div class="card" id="cardMarca"></div>
        <div class="card" id="cardTalle"></div>
    </div>

    <!-- Gráficos -->
    <div class="charts-container">
        <canvas id="chartRubros"></canvas>
        <canvas id="chartMarcas"></canvas>
        <canvas id="chartTalles"></canvas>
    </div>

</div>

<!-- ============================
     SCRIPTS
============================= -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* ============================
   TABS
============================= */
const tabBuscar = document.getElementById("tabBuscar");
const tabDashboard = document.getElementById("tabDashboard");
const vistaBuscar = document.getElementById("vistaBuscar");
const vistaDashboard = document.getElementById("vistaDashboard");

tabBuscar.onclick = () => {
    tabBuscar.classList.add("active");
    tabDashboard.classList.remove("active");
    vistaBuscar.style.display = "block";
    vistaDashboard.style.display = "none";
};

tabDashboard.onclick = () => {
    tabDashboard.classList.add("active");
    tabBuscar.classList.remove("active");
    vistaBuscar.style.display = "none";
    vistaDashboard.style.display = "block";
    cargarDashboardGlobal();
};

/* ============================
   VARIABLES GLOBALES
============================= */
let ultimaBusqueda = null;
let chartRubros, chartMarcas, chartTalles;

/* ============================
   ACTUALIZAR TARJETAS
============================= */
function actualizarTarjetas(data) {
    document.getElementById("cardStockTotal").innerHTML = `<b>Stock total:</b> ${data.stock_total}`;
    document.getElementById("cardArticulos").innerHTML = `<b>Artículos:</b> ${data.articulos}`;

    const rubroTop = Object.entries(data.rubros)[0]?.[0] || "-";
    const marcaTop = Object.entries(data.marcas)[0]?.[0] || "-";
    const talleTop = Object.entries(data.talles)[0]?.[0] || "-";

    document.getElementById("cardRubro").innerHTML = `<b>Rubro dominante:</b> ${rubroTop}`;
    document.getElementById("cardMarca").innerHTML = `<b>Marca dominante:</b> ${marcaTop}`;
    document.getElementById("cardTalle").innerHTML = `<b>Talle dominante:</b> ${talleTop}`;
}

/* ============================
   DIBUJAR GRÁFICOS
============================= */
function dibujarGraficos(data) {
    if (chartRubros) chartRubros.destroy();
    if (chartMarcas) chartMarcas.destroy();
    if (chartTalles) chartTalles.destroy();

    chartRubros = new Chart(document.getElementById("chartRubros"), {
        type: "doughnut",
        data: {
            labels: Object.keys(data.rubros),
            datasets: [{
                data: Object.values(data.rubros),
                backgroundColor: ["#4a90e2", "#50e3c2", "#f5a623", "#d0021b", "#9013fe"]
            }]
        }
    });

    chartMarcas = new Chart(document.getElementById("chartMarcas"), {
        type: "bar",
        data: {
            labels: Object.keys(data.marcas),
            datasets: [{
                label: "Stock por marca",
                data: Object.values(data.marcas),
                backgroundColor: "#4a90e2"
            }]
        }
    });

    chartTalles = new Chart(document.getElementById("chartTalles"), {
        type: "bar",
        data: {
            labels: Object.keys(data.talles),
            datasets: [{
                label: "Stock por talle",
                data: Object.values(data.talles),
                backgroundColor: "#50e3c2"
            }]
        }
    });
}

/* ============================
   CARGAR DASHBOARD GLOBAL
============================= */
async function cargarDashboardGlobal() {
    const res = await fetch("https://stock-backend-1-twzg.onrender.com/dashboard/global");
    const data = await res.json();

    actualizarTarjetas(data);
    dibujarGraficos(data);
}

/* ============================
   SELECTOR GLOBAL / BÚSQUEDA
============================= */
document.querySelectorAll("input[name='modoDashboard']").forEach(radio => {
    radio.addEventListener("change", () => {
        if (radio.value === "global") {
            cargarDashboardGlobal();
        } else {
            if (!ultimaBusqueda) {
                alert("Realizá una búsqueda primero.");
                return;
            }
            actualizarTarjetas(ultimaBusqueda);
            dibujarGraficos(ultimaBusqueda);
        }
    });
});

/* ============================
   GUARDAR RESULTADO DE BÚSQUEDA
============================= */
function guardarResultadoBusqueda(data) {
    if (data.tipo === "resumen") {
        ultimaBusqueda = {
            stock_total: data.resumen.unidades_totales || 0,
            articulos: data.resumen.cant_articulos || 0,
            rubros: contar(data.items, "rubro"),
            marcas: contar(data.items, "marca"),
            talles: contarTalles(data.items)
        };
    }
}

function contar(items, campo) {
    const mapa = {};
    items.forEach(i => {
        const key = i[campo] || "Sin dato";
        mapa[key] = (mapa[key] || 0) + (i.stock_total || 1);
    });
    return mapa;
}

function contarTalles(items) {
    const mapa = {};
    items.forEach(i => {
        i.talles.forEach(t => {
            mapa[t.talle] = (mapa[t.talle] || 0) + t.stock;
        });
    });
    return mapa;
}
</script>

</body>
</html>
