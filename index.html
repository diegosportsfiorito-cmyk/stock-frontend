<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock IA PRO v2.0</title>

<style>
/* ============================================================
   ESTILOS BASE
============================================================ */
body {
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

#app {
    padding: 20px;
    position: relative;
}

/* AUTOCOMPLETE */
#autocomplete-box {
    position: absolute;
    background: #1e1e1e;
    border-radius: 10px;
    border: 1px solid #2a2f36;
    width: 100%;
    display: none;
    z-index: 9999;
}

.suggestion {
    padding: 10px;
    cursor: pointer;
}
.suggestion:hover {
    background: #333;
}

/* ORB ANIMADO */
#orb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #4a90e2;
    position: absolute;
    right: 10px;
    top: 10px;
    display: none;
    box-shadow: 0 0 10px rgba(77,141,255,0.8);
    animation: orbPulse 1.2s infinite ease-in-out;
}

@keyframes orbPulse {
    0% { transform: scale(1); box-shadow: 0 0 10px rgba(77,141,255,0.8); }
    50% { transform: scale(1.4); box-shadow: 0 0 20px rgba(77,141,255,1); }
    100% { transform: scale(1); box-shadow: 0 0 10px rgba(77,141,255,0.8); }
}

/* BANNER OFFLINE */
#offlineBanner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 10px;
    background: #d62828;
    color: white;
    text-align: center;
    font-weight: bold;
    display: none;
    z-index: 99999;
}
</style>
</head>

<body>
<div id="offlineBanner">Sin conexión a internet. La app sigue funcionando, pero no puede consultar el servidor.</div>

<div id="app">
    <h2>Stock IA PRO v2.0</h2>

    <div style="position:relative;">
        <input id="pregunta" type="text" placeholder="Decime qué buscás..." autocomplete="off" style="width:100%;padding:12px;border-radius:8px;border:none;font-size:16px;" />
        <div id="autocomplete-box"></div>
        <div id="orb"></div>
    </div>

    <br>

    <button id="btnHablar">Hablar</button>
    <button id="btnManosLibres">Manos libres</button>
    <button id="btnStop">Stop</button>

    <br><br>

    <div id="respuesta"></div>
</div>

<script>
/* ============================================================
   CONFIG
============================================================ */
const backendURL = "https://stock-backend-1-twzg.onrender.com/query";
const autocompleteURL = "https://stock-backend-1-twzg.onrender.com/autocomplete";

/* ============================================================
   DETECCIÓN DE INTERNET
============================================================ */
const offlineBanner = document.getElementById("offlineBanner");

function actualizarEstadoConexion() {
    offlineBanner.style.display = navigator.onLine ? "none" : "block";
}
window.addEventListener("online", actualizarEstadoConexion);
window.addEventListener("offline", actualizarEstadoConexion);
actualizarEstadoConexion();

/* ============================================================
   ORB ANIMADO
============================================================ */
const orb = document.getElementById("orb");
function mostrarOrb() { orb.style.display = "block"; }
function ocultarOrb() { orb.style.display = "none"; }

/* ============================================================
   SONIDOS DE INICIO / FIN
============================================================ */
const sonidoInicio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA...");
const sonidoFin = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA...");

/* ============================================================
   MÓDULO DE VOZ PRO MAX
============================================================ */
let reconocimiento = null;
let escuchando = false;
let manosLibres = false;
let reconectando = false;
let dictadoContinuo = true; // ACTIVADO

function crearReconocimiento() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        alert("Tu navegador no soporta reconocimiento de voz.");
        return null;
    }

    const rec = new SR();
    rec.lang = "es-AR";
    rec.continuous = dictadoContinuo;
    rec.interimResults = false;

    rec.onstart = () => {
        escuchando = true;
        mostrarOrb();
        sonidoInicio.play();
    };

    rec.onend = () => {
        escuchando = false;
        ocultarOrb();
        sonidoFin.play();

        if (manosLibres && !reconectando) {
            reconectando = true;
            setTimeout(() => {
                reconectando = false;
                if (manosLibres) rec.start();
            }, 300);
        }
    };

    rec.onerror = () => {
        escuchando = false;
        ocultarOrb();

        if (manosLibres && !reconectando) {
            reconectando = true;
            setTimeout(() => {
                reconectando = false;
                if (manosLibres) rec.start();
            }, 500);
        }
    };

    rec.onresult = (event) => {
        const texto = event.results[event.results.length - 1][0].transcript;
        input.value = texto;
        enviarConsulta();
    };

    return rec;
}

function iniciarVoz() {
    if (!reconocimiento) reconocimiento = crearReconocimiento();
    if (!reconocimiento) return;

    if (!escuchando) reconocimiento.start();
}

function detenerVoz() {
    manosLibres = false;
    escuchando = false;
    reconectando = false;

    if (reconocimiento) reconocimiento.stop();
    speechSynthesis.cancel();
    ocultarOrb();
}

/* ============================================================
   BOTONES
============================================================ */
document.getElementById("btnHablar").onclick = () => {
    detenerVoz();
    iniciarVoz();
};

document.getElementById("btnManosLibres").onclick = () => {
    manosLibres = !manosLibres;
    if (manosLibres) iniciarVoz();
    else detenerVoz();
};

document.getElementById("btnStop").onclick = () => detenerVoz();

/* ============================================================
   AUTOCOMPLETE
============================================================ */
const input = document.getElementById("pregunta");
const box = document.getElementById("autocomplete-box");

let autoTimer = null;

input.addEventListener("input", () => {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(buscarSugerencias, 120);
});

async function buscarSugerencias() {
    const q = input.value.trim();
    if (q.length < 1) {
        box.style.display = "none";
        return;
    }

    if (!navigator.onLine) return;

    const res = await fetch(`${autocompleteURL}?q=${encodeURIComponent(q)}`);
    const data = await res.json();

    if (!data.sugerencias || data.sugerencias.length === 0) {
        box.style.display = "none";
        return;
    }

    box.innerHTML = "";
    data.sugerencias.forEach(s => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.textContent = s;
        div.onclick = () => {
            input.value = s;
            box.style.display = "none";
            enviarConsulta();
        };
        box.appendChild(div);
    });

    box.style.display = "block";
}

/* ============================================================
   CONSULTA AL BACKEND
============================================================ */
async function enviarConsulta() {
    if (!navigator.onLine) {
        document.getElementById("respuesta").innerHTML =
            "<div class='card'>Sin conexión a internet. No se puede consultar el servidor.</div>";
        return;
    }

    const pregunta = input.value.trim();
    if (!pregunta) return;

    document.getElementById("respuesta").innerHTML = "<p>Consultando...</p>";

    const res = await fetch(backendURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: pregunta })
    });

    const data = await res.json();
    renderResultados(data);
}

/* ============================================================
   RENDER DE RESULTADOS
============================================================ */
function renderResultados(data) {
    document.getElementById("respuesta").innerHTML =
        `<pre>${JSON.stringify(data, null, 2)}</pre>`;
}
</script>

</body>
</html>
