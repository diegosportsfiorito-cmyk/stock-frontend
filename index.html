    VERSION TEST 1001
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOCK IA PRO — Scanner en vivo</title>

  <link rel="stylesheet" href="orb.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="orb-center orb-b2">

  <!-- TEST VISUAL -->
  <div style="background:red;color:white;padding:10px;font-size:20px;">
    VERSION TEST 995 — SCANNER EN VIVO
  </div>

  <div class="app-shell">
    <div class="app-container">

      <div class="app-header">
        <div class="branding">
          <div>
            <div class="brand-title">STOCK IA PRO</div>
            <div class="brand-subtitle">Asistente inteligente de stock</div>
          </div>
        </div>

        <div class="header-right">
          <div class="connection-indicator">
            <div class="connection-dot"></div>
            <span>Estado conexión</span>
          </div>
        </div>
      </div>

      <!-- ORB -->
      <div class="orb-zone">
        <div class="orb-wrapper">
          <div class="orb" id="orb">IA PRO</div>
          <div class="orb-tooltip" id="orb-tooltip">
            <span class="orb-tooltip-arrow"></span>
            <span class="orb-tooltip-text">Tocá para buscar</span>
          </div>
        </div>
      </div>

      <section class="search-card">
        <div class="search-row">

          <div class="search-input-wrapper">
            <input
              id="search-input"
              class="search-input"
              type="text"
              placeholder="Buscar artículo, marca o rubro…"
              autocomplete="off"
            />
          </div>

          <!-- BOTÓN SCAN -->
          <button id="btn-scanner" class="scanner-btn" title="Escanear">📸</button>

          <div class="scanner-mode-switch">
            <div id="scanner-mode-simple" class="scanner-mode-option active">Simple</div>
            <div id="scanner-mode-completo" class="scanner-mode-option">Completo</div>
          </div>

        </div>
      </section>

      <div class="main-row">
        <section class="results-card">
          <div class="results-header">
            <div class="results-title">Resultados</div>
            <div class="results-status" id="results-status">Esperando consulta</div>
          </div>

          <div id="results-container"></div>
        </section>
      </div>

    </div>
  </div>

  <!-- ⭐ OVERLAY SCANNER — VIDEO DIRECTO SIN DISTORSIÓN -->
  <div id="scanner-overlay" style="
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:black;
    display:none;
    flex-direction:column;
    z-index:9999;
  ">
    <video id="scanner-video" autoplay playsinline style="
      width:100%;
      height:auto;
      background:black;
      flex-grow:1;
    "></video>

    <button id="scanner-close" style="
      padding:20px;
      font-size:20px;
      background:white;
      border:none;
      width:100%;
    ">Cerrar</button>
  </div>

  <script src="scanner.js"></script>
  <script src="ui.js"></script>
  <script src="app_v2.js"></script>

</body>
</html>
